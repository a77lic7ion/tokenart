<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./icon.svg" />
  <title>TokenArt</title>
  <style>
    :root[data-theme="light"] { color-scheme: light; --bg: #f4efe5; --panel: rgba(244,239,229,.86); --line: rgba(23,26,26,.18); --line-strong: rgba(23,26,26,.4); --text: #171a1a; --strong: #3c4440; --muted: #757d75; --faint: #8b938c; --track: rgba(23,26,26,.1); --bar: #171a1a; --warn: #a08048; --accent: #5faaa3; }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #14171a; --panel: rgba(20,23,26,.88); --line: rgba(236,231,220,.18); --line-strong: rgba(236,231,220,.45); --text: #ece7dc; --strong: #cdd3cb; --muted: #9aa39e; --faint: #7b827d; --track: rgba(236,231,220,.14); --bar: #ece7dc; --warn: #d2a869; --accent: #6fbcb4; }
    html, body { margin: 0; min-height: 100%; overflow: hidden; background: var(--bg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
    #app { position: fixed; inset: 0; }
    .panel { position: fixed; padding: 13px 15px; border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(7px); }
    .hud { top: 20px; left: 22px; max-width: 300px; }
    .eyebrow { color: var(--accent); font-size: 9px; letter-spacing: .16em; }
    h1 { margin: 8px 0 4px; font: 600 18px/1.05 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.05em; }
    p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .btns { display: flex; gap: 7px; margin-top: 11px; }
    .btn { all: unset; cursor: pointer; font-size: 9px; letter-spacing: .1em; color: var(--muted); padding: 4px 9px; border: 1px solid var(--line); }
    .btn:hover { color: var(--text); border-color: var(--line-strong); }
    .count { margin-top: 10px; color: var(--strong); font-size: 10px; }
    .collect-status { margin-top: 8px; color: var(--faint); font-size: 9px; line-height: 1.4; }
    .collect-status .spin { display: inline-block; width: 8px; height: 8px; border: 1px solid var(--faint); border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 5px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .legend { bottom: 20px; left: 22px; width: 320px; }
    .legend-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .legend-head > span { font-size: 9px; letter-spacing: .16em; color: var(--strong); }
    .legend-groups { margin-top: 10px; }
    .legend-groups.collapsed { display: none; }
    .legend-group + .legend-group { margin-top: 11px; }
    .group-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .legend-group-title { font-size: 8px; letter-spacing: .14em; color: var(--faint); }
    .group-actions { display: flex; gap: 8px; }
    .mini { all: unset; cursor: pointer; font-size: 8px; letter-spacing: .1em; color: var(--muted); border-bottom: 1px solid transparent; }
    .mini:hover { color: var(--text); border-bottom-color: var(--line-strong); }
    .entry { padding: 1px 0 4px; }
    .row { display: grid; grid-template-columns: 12px 10px 1fr auto; align-items: center; gap: 8px; font-size: 10px; cursor: pointer; }
    .row input { appearance: none; width: 11px; height: 11px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; position: relative; margin: 0; }
    .row input:checked::after { content: ""; position: absolute; inset: 2px; background: var(--bar); }
    .swatch { width: 9px; height: 9px; border-radius: 50%; }
    .nm { color: var(--strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st { color: var(--faint); font-size: 9px; }
    .entry.off .nm, .entry.off .st { opacity: .4; }
    .entry.off .swatch { opacity: .28; }
    .meta { margin: 2px 0 0 30px; color: var(--faint); font-size: 9px; line-height: 1.4; }
    .meta b { color: var(--strong); font-weight: 600; font-variant-numeric: tabular-nums; }
    .meta .blind { color: var(--warn); }
    .bar { height: 2px; background: var(--track); margin: 4px 0 2px 30px; }
    .bar i { display: block; height: 2px; background: var(--bar); opacity: .45; }
    .ground-entry { padding: 1px 0 3px; }
    .ground-entry .row { grid-template-columns: 10px 1fr auto; cursor: default; }
    .legend-foot { margin-top: 11px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 9px; color: var(--faint); line-height: 1.55; }
    .legend-foot b { color: var(--strong); font-weight: 600; font-variant-numeric: tabular-nums; }
    .legend-foot .warn { color: var(--warn); }
  </style>
  <script type="importmap">
    { "imports": { "three": "./three.module.js" } }
  </script>
</head>
<body>
  <main id="app"></main>

  <section class="panel hud">
    <div class="eyebrow">AFFLICTED AI / DENSITY MAP</div>
    <h1>Urban point-cloud districts</h1>
    <p>Terrain → roads → parcels → buildings → trees. Provider usage controls cluster completeness, not box size.</p>
    <div class="btns">
      <button class="btn" id="collectBtn" title="Refresh usage data now">COLLECT + BUILD</button>
      <button class="btn" id="replayBtn" title="Replay the build animation (B)">REPLAY</button>
      <button class="btn" id="themeBtn" title="Toggle theme (T)">DARK</button>
      <button class="btn" id="resetBtn" title="Reset the camera (R)">RESET VIEW</button>
    </div>
    <div class="count" id="count">Generating point cloud…</div>
    <div class="collect-status" id="collectStatus"></div>
  </section>

  <aside class="panel legend">
    <div class="legend-head">
      <span>INFRASTRUCTURE KEY</span>
      <button class="mini" id="legendToggle" title="Toggle (L)">HIDE</button>
    </div>
    <div class="legend-groups" id="legendGroups"></div>
    <div class="legend-foot" id="legendFoot"></div>
  </aside>

  <script type="module">
    import * as THREE from "./three.module.js";
    import { generateCityData } from "./procedural-city-data.js";
    import { createCityRenderer, accentKey, legendHex, THEME_NAMES } from "./procedural-city-renderer.js";

    const STORE = { theme: "citykit.theme", visible: "citykit.visible" };
    const store = {
      get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
      set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode */ } },
    };

    const getJSON = async (url) => {
      try {
        const res = await fetch(url, { cache: "no-store" });
        return res.ok ? await res.json() : null;
      } catch { return null; }
    };

    let cityDoc = await getJSON("./city.json");
    let usage = await getJSON("./usage.json");

    const projects = Array.isArray(cityDoc?.projects) && cityDoc.projects.length ? cityDoc.projects : undefined;
    const providerById = new Map((usage?.providers ?? []).map((p) => [p.id, p]));

    const resolved = new Map();
    for (const project of projects ?? []) {
      if (!project.source) continue;
      const prov = providerById.get(project.source);
      if (!prov) continue;
      let share = null;
      let mode = "no_data";
      if (prov.status === "ok" && prov.used != null) {
        const limit = prov.limit ?? project.reference?.full ?? null;
        if (limit && limit > 0) {
          share = Math.max(0, Math.min(1, prov.used / limit));
          mode = prov.limit != null ? "of_limit" : "of_reference";
        }
      }
      resolved.set(project.id, { mode, share, prov });
      if (share != null) project.tokenShare = share;
    }

    // Load Forge dot data for districts that reference a Forge project
    for (const project of projects ?? []) {
      if (!project.forgeProject) continue;
      try {
        const dotsRes = await fetch(`/api/forge/${project.forgeProject}/dots`, { cache: "no-store" });
        if (dotsRes.ok) project.forgeDots = await dotsRes.json();
      } catch { /* Forge unavailable — district renders without dot data */ }
    }

    // --- Blank start + session import ---
    const hudCount = document.getElementById('count');
    const hudStatus = document.getElementById('collectStatus');



    // Also keep the normal COLLECT+BUILD flow
    document.getElementById('collectBtn').addEventListener('click', async () => {
      // ... existing collect logic ...
    });

    // Start with an empty city — data gets populated when a session is imported
    let data = generateCityData({ projects: [], hermes_sessions: null });

    // Deep links: ?theme=dark&only=hermes,openrouter
    const query = new URLSearchParams(location.search);
    let theme = query.get("theme") ?? store.get(STORE.theme, "light");
    if (!THEME_NAMES.includes(theme)) theme = "light";

    let allIds = data.districts.map((d) => d.project.id);
    const queryOnly = query.get("only");
    let selected = queryOnly
      ? allIds.filter((id) => queryOnly.split(",").includes(id))
      : store.get(STORE.visible, null);
    selected = Array.isArray(selected) ? allIds.filter((id) => selected.includes(id)) : allIds.slice();
    if (!selected.length) selected = allIds.slice();

    document.documentElement.dataset.theme = theme;

    const renderer = createCityRenderer({
      container: document.querySelector("#app"),
      cityData: data,
      theme,
      visibleIds: selected,
    });

    // Tap/click to show district name (mobile-friendly)
    const tooltip = document.createElement("div");
    tooltip.style.cssText = "position:fixed;pointer-events:none;background:rgba(0,0,0,.82);color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;z-index:100;display:none;white-space:nowrap;";
    document.body.appendChild(tooltip);
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const LEVEL_HEIGHT = 2.4;

    // Each district's world-space footprint comes from its project.origin + project.size.
    // We raycast against these boxes: the point cloud is a plain Mesh (not InstancedMesh),
    // so raycasting the dots directly would never report a district.
    const districtBoxes = data.districts.map((d) => {
      const tier = Math.max(0, Math.round(d.project.tier ?? 0));
      const hw = (d.project.size?.width ?? 6) / 2;
      const hd = (d.project.size?.depth ?? 6) / 2;
      const y0 = tier * LEVEL_HEIGHT - 0.5;
      return new THREE.Box3(
        new THREE.Vector3(d.project.origin.x - hw, y0, d.project.origin.z - hd),
        new THREE.Vector3(d.project.origin.x + hw, y0 + 9, d.project.origin.z + hd),
      );
    });

    // Hover (mousemove): district name appears on cursor over, hides on mouseout
    let currentDistrict = null;

    document.querySelector("canvas").addEventListener("mousemove", (e) => {
      const rect = renderer.renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, renderer.camera);
      let best = null;
      let bestDist = Infinity;
      districtBoxes.forEach((box, i) => {
        const hit = new THREE.Vector3();
        if (raycaster.ray.intersectBox(box, hit)) {
          const d = hit.distanceTo(raycaster.ray.origin);
          if (d < bestDist) { bestDist = d; best = data.districts[i]; }
        }
      });
      if (best) {
        if (currentDistrict !== best.project.id) {
          currentDistrict = best.project.id;
          tooltip.textContent = best.project.name + " — " + (best.project.provider || "");
          tooltip.style.display = "block";
        }
        tooltip.style.left = (e.clientX + 14) + "px";
        tooltip.style.top = (e.clientY - 10) + "px";
        renderer.renderer.domElement.style.cursor = "pointer";
      } else {
        if (currentDistrict !== null) {
          currentDistrict = null;
          tooltip.style.display = "none";
        }
        renderer.renderer.domElement.style.cursor = "default";
      }
    });

    // Hide tooltip when cursor leaves the canvas entirely
    document.querySelector("canvas").addEventListener("mouseleave", () => {
      if (currentDistrict !== null) {
        currentDistrict = null;
        tooltip.style.display = "none";
      }
    });

    // Tap (click) for mobile: show the session info briefly, then auto-hide
    document.querySelector("canvas").addEventListener("click", (e) => {
      const rect = renderer.renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, renderer.camera);
      let best = null;
      let bestDist = Infinity;
      districtBoxes.forEach((box, i) => {
        const hit = new THREE.Vector3();
        if (raycaster.ray.intersectBox(box, hit)) {
          const d = hit.distanceTo(raycaster.ray.origin);
          if (d < bestDist) { bestDist = d; best = data.districts[i]; }
        }
      });
      if (best) {
        const p = best.project;
        const sessionTitle = p.title || p.name;
        const modelName = p.kind === 'model' ? p.model || p.name : '';
        const tokens = p._used != null ? compact(p._used) + ' tok' : '';
        tooltip.textContent = modelName ? `${sessionTitle} — ${modelName} — ${tokens}` : `${sessionTitle} — ${tokens}`;
        tooltip.style.display = "block";
        tooltip.style.left = (e.clientX + 14) + "px";
        tooltip.style.top = (e.clientY - 10) + "px";
        clearTimeout(tooltip._hide);
        tooltip._hide = setTimeout(() => { tooltip.style.display = "none"; }, 2500);
      }
    });

    // Cursor feedback on hover
    renderer.renderer.domElement.style.cursor = "default";

    const countEl = document.querySelector("#count");
    const groupsEl = document.querySelector("#legendGroups");
    const footEl = document.querySelector("#legendFoot");
    const themeBtn = document.querySelector("#themeBtn");
    const collectBtn = document.querySelector("#collectBtn");
    const collectStatus = document.querySelector("#collectStatus");

    const band = (c) => (c < 0.4 ? "sparse" : c < 0.65 ? "partial" : "complete");
    const compact = (n) =>
      n >= 1e9 ? (n / 1e9).toFixed(2) + "B"
      : n >= 1e6 ? (n / 1e6).toFixed(2) + "M"
      : n >= 1e3 ? (n / 1e3).toFixed(1) + "k"
      : String(Math.round(n * 1000) / 1000);
    const fmt = (metric, value) =>
      value == null ? "—"
      : metric === "usd" ? "$" + value.toFixed(4)
      : metric === "percent" ? value.toFixed(1) + "%"
      : compact(value) + " tokens";

    function paintCount() {
      const visible = allIds.filter((id) => selected.includes(id)).length;
      countEl.textContent =
        `${renderer.pointCount.toLocaleString()} points · ${visible}/${allIds.length} districts shown · ${data.roads.length} roads`;
    }

    function paintLegend() {
      const hexes = legendHex(theme);
      const counts = renderer.districtPointCounts;
      groupsEl.replaceChildren();

      // Group districts by session: kind='session' districts are the groups
      const sessionDistricts = data.districts.filter(d => d.project.kind === 'session');
      const modelDistricts = data.districts.filter(d => d.project.kind === 'model');

      // Build a map of session id -> model districts
      const sessionModels = new Map();
      for (const md of modelDistricts) {
        const sessionId = md.project.id.replace(/-model-\d+$/, '');
        if (!sessionModels.has(sessionId)) sessionModels.set(sessionId, []);
        sessionModels.get(sessionId).push(md);
      }

      // SESSIONS group
      const structure = document.createElement("div");
      structure.className = "legend-group";

      const shead = document.createElement("div");
      shead.className = "group-head";
      const stitle = document.createElement("div");
      stitle.className = "legend-group-title";
      stitle.textContent = `SESSIONS — ${sessionDistricts.length} session${sessionDistricts.length !== 1 ? 's' : ''}`;
      const sactions = document.createElement("div");
      sactions.className = "group-actions";
      for (const [label, ids, hint] of [
        ["ALL", allIds, "Show every district"],
        ["NONE", [], "Show the bare island — ground only"],
      ]) {
        const b = document.createElement("button");
        b.className = "mini";
        b.textContent = label;
        b.title = hint;
        b.addEventListener("click", () => {
          selected = ids.slice();
          applyVisibility();
        });
        sactions.append(b);
      }
      shead.append(stitle, sactions);
      structure.append(shead);

      // Each session as a collapsible group with a checkbox
      for (const district of sessionDistricts) {
        const id = district.project.id;
        const on = selected.includes(id);
        const models = sessionModels.get(id) || [];
        const totalTokens = district.project._used || 0;
        const msgs = district.project.reference?.detail?.match(/Models: (\d+)/)?.[1] || models.length;

        const box = document.createElement("div");
        box.className = "entry" + (on ? "" : " off");

        const row = document.createElement("label");
        row.className = "row";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = on;
        cb.addEventListener("change", () => {
          // Toggle all models in this session
          const sessionModelIds = models.map(m => m.project.id);
          if (cb.checked) {
            selected = [...new Set([...selected, ...sessionModelIds])];
          } else {
            selected = selected.filter(x => !sessionModelIds.includes(x));
          }
          applyVisibility();
        });

        const sw = document.createElement("span");
        sw.className = "swatch";
        sw.style.background = hexes[accentKey(district.project)];

        const nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = district.project.name;

        const st = document.createElement("span");
        st.className = "st";
        st.textContent = compact(totalTokens) + " tok";

        row.append(cb, sw, nm, st);
        box.append(row);

        // Model sub-entries
        for (const md of models) {
          const mid = md.project.id;
          const mon = selected.includes(mid);
          const mbox = document.createElement("div");
          mbox.className = "entry sub" + (mon ? "" : " off");

          const mrow = document.createElement("label");
          mrow.className = "row";

          const mcb = document.createElement("input");
          mcb.type = "checkbox";
          mcb.checked = mon;
          mcb.addEventListener("change", () => {
            if (mcb.checked) {
              selected = [...new Set([...selected, mid])];
            } else {
              selected = selected.filter(x => x !== mid);
            }
            applyVisibility();
          });

          const msw = document.createElement("span");
          msw.className = "swatch";
          msw.style.background = hexes[accentKey(md.project)];

          const nm2 = document.createElement("span");
          nm2.className = "nm";
          nm2.textContent = md.project.name;

          const mst = document.createElement("span");
          mst.className = "st";
          const mTokens = md.project._used || 0;
          mst.textContent = compact(mTokens) + " tok";

          mrow.append(mcb, msw, nm2, mst);
          mbox.append(mrow);

          // Meta with evidence
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = md.project.evidence || "";
          mbox.append(meta);

          structure.append(mbox);
        }

        structure.append(box);
      }

      groupsEl.append(structure);

      const ground = document.createElement("div");
      ground.className = "legend-group";
      const ghead = document.createElement("div");
      ghead.className = "group-head";
      const gtitle = document.createElement("div");
      gtitle.className = "legend-group-title";
      gtitle.textContent = "GROUND — ALWAYS DRAWN";
      ghead.append(gtitle);
      ground.append(ghead);

      const groundRows = [
        [hexes.soil, "Terrain field"],
        [hexes.soil, "Eroded island edge"],
        [hexes.ink, "Boulevards"],
        [hexes.softInk, "Lanes / parcel roads"],
        [hexes.ink, "Tree canopies"],
        [hexes.softInk, "Trunks / terrain grid"],
      ];
      for (const [hex, name] of groundRows) {
        const box = document.createElement("div");
        box.className = "ground-entry";
        const row = document.createElement("div");
        row.className = "row";
        const sw = document.createElement("span");
        sw.className = "swatch";
        sw.style.background = hex;
        const nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = name;
        const st = document.createElement("span");
        st.className = "st";
        st.textContent = "—";
        row.append(sw, nm, st);
        box.append(row);
        ground.append(box);
      }
      groupsEl.append(ground);
    }

    function paintFoot() {
      if (!usage) {
        footEl.innerHTML = "<b>No usage data.</b><br>usage.json not found.<br>Districts fall back to authored placeholder shares.";
        return;
      }
      const c = usage.state?.counters ?? null;
      const stamp = usage.generated_at.replace("T", " ").replace("Z", " UTC");
      const reporting = (usage.providers ?? []).filter((p) => p.status === "ok").length;
      const blind = (usage.providers ?? []).filter((p) => p.status === "no_api" || p.status === "no_key").length;
      footEl.innerHTML =
        `<b>Measured: ${compact(usage.measured_total_tokens)} Hermes tokens</b><br>` +
        (c ? `in ${compact(c.input_tokens)} · out ${compact(c.output_tokens)} · cache-read ${compact(c.cache_read_tokens)}<br>` : "") +
        (usage.state ? `${usage.state.sessions} sessions · ` : "") +
        `${reporting} providers reporting · ${blind} blind<br>` +
        `<span class="warn">Provider figures are account-scoped, so they include usage from any app on that account. Districts without data keep a placeholder share.</span><br>` +
        (usage.history?.days_tracked ? `${usage.history.days_tracked} day${usage.history.days_tracked === 1 ? "" : "s"} tracked<br>` : "") +
        `<span style="opacity:.75">${stamp}</span>`;
    }

    function applyVisibility() {
      renderer.setVisible(selected);
      store.set(STORE.visible, selected);
      paintLegend();
      paintCount();
    }

    function applyTheme(next) {
      theme = next;
      document.documentElement.dataset.theme = theme;
      renderer.setTheme(theme);
      store.set(STORE.theme, theme);
      themeBtn.textContent = theme === "dark" ? "LIGHT" : "DARK";
      paintLegend();
      paintCount();
    }

    async function runCollect() {
      collectBtn.disabled = true;
      collectStatus.innerHTML = '<span class="spin"></span>Querying all sessions…';
      try {
        const res = await fetch("/api/sessions", { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch sessions');
        const allSessions = await res.json();
        if (!Array.isArray(allSessions) || !allSessions.length) {
          throw new Error('No sessions found');
        }
        // Filter to user-specified sessions
        const targetSessions = ['ElderWatch New', '3Dcity', 'JARVIS'];
        const sessions = allSessions.filter(s =>
          targetSessions.includes(s.title) || targetSessions.includes(s.id)
        );
        if (!sessions.length) {
          throw new Error('No matching sessions found. Available: ' + allSessions.map(s => s.title).join(', '));
        }

        // City grid layout: sessions as blocks, models as buildings within blocks
        const modelAccents = ['amber','red','teal','blue','green','purple','coral','ink','soil','softInk'];
        const shortModel = (m) => { const b = m.split('/').pop().replace(/:.*/, ''); return b.length > 20 ? b.slice(0,18)+'…' : b; };

        // City grid: fixed 2 columns, expand rows upward
        const blockSize = 4;
        const gap = 2;
        const maxCols = 2;
        const cols = Math.min(maxCols, sessions.length);
        const rows = Math.ceil(sessions.length / maxCols);
        const totalW = cols * (blockSize + gap) - gap;
        const totalH = rows * (blockSize + gap) - gap;
        const offsetX = -(totalW - blockSize) / 2;
        const offsetZ = -(totalH - blockSize) / 2;

        const allProjects = [];

        sessions.forEach((session, idx) => {
          const models = session.models || [];
          const totalTokens = session.total_tokens || 0;
          const msgs = session.message_count || 0;
          const title = session.title || session.id?.slice(0,20) || 'unknown';
          const provider = session.provider || 'unknown';

          // Block position in city grid
          const col = idx % cols;
          const row = Math.floor(idx / cols);
          const bx = offsetX + col * (blockSize + gap);
          const bz = offsetZ + row * (blockSize + gap);

          // Log scale for block size
          const logTokens = Math.log10(Math.max(totalTokens, 1000));
          const scale = Math.max(0.5, Math.min(2.5, logTokens / 2.5));

          // Models within this session: each gets a unique color, arranged in a grid within the block
          const modelProjects = models.map((model, mi) => {
            const mCol = mi % Math.ceil(Math.sqrt(models.length));
            const mRow = Math.floor(mi / Math.ceil(Math.sqrt(models.length)));
            const cellW = blockSize / Math.ceil(Math.sqrt(models.length));
            const cellH = blockSize / Math.ceil(Math.sqrt(models.length));
            const mx = bx + mCol * cellW + cellW / 2;
            const mz = bz + mRow * cellH + cellH / 2;
            const mShare = totalTokens > 0 ? model.total_tokens / totalTokens : 0;
            const mScale = Math.max(0.3, 0.5 + mShare * 2);

            return {
              id: `${session.id}-model-${mi}`,
              name: shortModel(model.model),
              title: title,
              provider: model.provider,
              model: model.model,
              accent: modelAccents[mi % modelAccents.length],
              style: 'civic',
              tokenShare: Math.max(0.05, mShare),
              origin: { x: mx, z: mz },
              size: { width: 2 * mScale, depth: 2 * mScale },
              tier: 0,
              kind: 'model',
              evidence: `${model.model} — ${model.total_tokens.toLocaleString()} tokens (${model.calls} calls) via ${model.provider}`,
              reference: { metric: 'model_tokens', full: model.total_tokens, detail: `In: ${model.input_tokens.toLocaleString()} · Out: ${model.output_tokens.toLocaleString()}` },
              _used: model.total_tokens,
              _status: 'ok',
            };
          });

          // Session cluster
          allProjects.push({
            id: session.id,
            name: title.slice(0, 25),
            title: title,
            provider: provider,
            model: 'multi-model',
            accent: modelAccents[idx % modelAccents.length],
            style: 'civic',
            tokenShare: 1,
            origin: { x: bx + blockSize / 2, z: bz + blockSize / 2 },
            size: { width: blockSize * scale, depth: blockSize * scale },
            tier: 0,
            kind: 'session',
            evidence: `Session '${title}' — ${totalTokens.toLocaleString()} tokens (${msgs} msgs) via ${provider}`,
            reference: { metric: 'session_tokens', full: totalTokens, detail: `Models: ${models.length} · In: ${session.input_tokens?.toLocaleString() || 0} · Out: ${session.output_tokens?.toLocaleString() || 0}` },
            _used: totalTokens,
            _status: 'ok',
            _modelProjects: modelProjects,
          });
          allProjects.push(...modelProjects);
        });

        const newData = generateCityData({ projects: allProjects, hermes_sessions: null });
        data = newData;
        allIds = newData.districts.map(d => d.project.id);
        selected = allIds.slice();
        renderer.setCityData(data);
        paintLegend();
        paintCount();
        collectStatus.innerHTML = `<span style="color: var(--accent)">✓ ${sessions.length} sessions · ${allProjects.length} districts</span>`;
      } catch (e) {
        collectStatus.innerHTML = `<span style="color: var(--warn)">Error: ${e.message}</span>`;
      } finally {
        collectBtn.disabled = false;
      }
    }

    collectBtn.addEventListener("click", runCollect);
    themeBtn.addEventListener("click", () => applyTheme(theme === "dark" ? "light" : "dark"));

    // Replay the build animation over the city as it stands. The camera is untouched, so this
    // is purely a re-enactment of the reveal — nothing is recollected and no data changes.
    document.querySelector("#replayBtn").addEventListener("click", () => renderer.triggerBuild());

    document.querySelector("#legendToggle").addEventListener("click", (e) => {
      groupsEl.classList.toggle("collapsed");
      e.currentTarget.textContent = groupsEl.classList.contains("collapsed") ? "SHOW" : "HIDE";
    });

    document.querySelector("#resetBtn").addEventListener("click", () => {
      renderer.camera.position.set(...renderer.defaultCamera);
      renderer.controls.target.set(0, 0.5, 0);
      renderer.controls.update();
    });

    // Print preview mode: orthographic projection, no ripple
    let printMode = false;
    let previewDots = null;
    let previewName = '';
    let previewWidth = '?';
    let previewHeight = '?';
    let previewEdgeBiased = false;
    let previewTiling = null;
    document.getElementById("printBtn").addEventListener("click", () => {
      printMode = !printMode;
      if (printMode && previewDots) {
        renderer.setPrintPreview(previewDots, 254, 169.33, 300);
        printBtn.textContent = "EXIT PRINT";
        printBtn.style.color = "var(--accent)";
        countEl.textContent = `${previewDots.length.toLocaleString()} dots · PRINT PREVIEW`;
      } else if (previewDots) {
        renderer.setDots(previewDots, previewName || 'Imported');
        printBtn.textContent = "PRINT";
        printBtn.style.color = "";
        countEl.textContent = `${previewDots.length.toLocaleString()} dots · ${previewWidth || '?'}×${previewHeight || '?'} · edge-biased: ${previewEdgeBiased ? 'yes' : 'no'}`;
        // Show tiling info if available
        if (previewTiling) {
          countEl.textContent += ` · tile: ${previewTiling.cols}×${previewTiling.rows} bleed ${previewTiling.bleedMm}mm`;
        }
      } else {
        printMode = false;
        printBtn.textContent = "PRINT";
        printBtn.style.color = "";
      }
    });

    // Import a Stipple Forge template JSON and render it
    document.getElementById("importInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const tmpl = JSON.parse(ev.target.result);
          if (!tmpl.dots || !Array.isArray(tmpl.dots)) { alert("Invalid template: no dots array"); return; }
          renderer.setDots(tmpl.dots, tmpl.name || 'Imported', {
            mode: tmpl.mode || 'mono',
            edges: tmpl.edges || 'basic',
            seed: tmpl.seed || '?',
            stats: tmpl.stats || {},
            tiling: tmpl.stats?.tiling || null,
          });
          previewName = tmpl.name || 'Imported';
          previewWidth = tmpl.width || '?';
          previewHeight = tmpl.height || '?';
          previewEdgeBiased = tmpl.edges === 'silhouette+detail';
          previewTiling = tmpl.stats?.tiling || null;
          document.title = tmpl.name || 'TokenArt';
          countEl.textContent = `${tmpl.dots.length.toLocaleString()} dots · ${tmpl.width || '?'}×${tmpl.height || '?'} · edge-biased: ${tmpl.edgeBiased ? 'yes' : 'no'}`;
          collectStatus.innerHTML = '<span style="color: var(--accent)">✓ Imported: ' + (tmpl.name || 'template') + ' — ' + tmpl.dots.length.toLocaleString() + ' dots rendered</span>';
        } catch (err) { alert("Failed to parse template: " + err.message); }
      };
      reader.readAsText(file);
      e.target.value = ''; // allow re-importing same file
    });

    addEventListener("keydown", (e) => {
      if (e.key === "l" || e.key === "L") document.querySelector("#legendToggle").click();
      if (e.key === "t" || e.key === "T") themeBtn.click();
      if (e.key === "r" || e.key === "R") document.querySelector("#resetBtn").click();
      if (e.key === "b" || e.key === "B") renderer.triggerBuild();
    });

    themeBtn.textContent = theme === "dark" ? "LIGHT" : "DARK";
    paintLegend();
    paintFoot();
    paintCount();
  </script>
</body>
</html>
